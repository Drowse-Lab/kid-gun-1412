plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'jp.hiromichi.kidgun1412'
version = findProperty('mod_version') ?: '1.2.0-rc'
archivesBaseName = 'kid_gun_1412'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // TaCZの配布JAR内にあるSRG名のMixin refmapを、開発環境の
            // official mappingsへ実行時に変換する。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods { kid_gun_1412 { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = file('libs').toURI(); metadataSources { artifact() } }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation fg.deobf('local:tacz:1.20.1-1.1.8-hotfix')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def gunPackZip = layout.buildDirectory.file('generated/kid_gun_1412.zip')
tasks.register('buildGunPack', Zip) {
    archiveFileName = 'kid_gun_1412.zip'
    destinationDirectory = layout.buildDirectory.dir('generated')
    from('assets') { into 'assets' }
    from('data') { into 'data' }
    from('gunpack.meta.json')
    exclude '**/.DS_Store'
}

processResources {
    dependsOn tasks.named('buildGunPack')
    inputs.property 'mod_version', version
    filesMatching('META-INF/mods.toml') { expand mod_version: version }
    from(gunPackZip) { into 'assets/kid_gun_1412/custom' }
}
